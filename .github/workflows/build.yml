name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PeripheralBattery.slnx

      - name: Build
        run: dotnet build PeripheralBattery.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PeripheralBattery.slnx -c Release --no-build --nologo

      - name: Format check
        run: dotnet format PeripheralBattery.slnx --verify-no-changes --no-restore --verbosity minimal